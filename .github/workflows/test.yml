name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 커밋된 gradle wrapper 가 없어 setup-gradle 이 Gradle 자체를 provision — 버전은
      # Dockerfile 의 빌더 이미지(gradle:8.12-jdk21)와 맞춰 로컬/CI/이미지 빌드 간 드리프트를 막는다.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      # 유닛 + 통합 풀 스위트 — test-contract.md §4. Docker 는 ubuntu-latest 러너 기본 제공.
      - run: gradle test
      - run: gradle integrationTest
